# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
# Official names: "Azure Architecture Center", "GitHub Flavored Markdown",
# HashiCorp and the Ratatui project/crates.
accepted = ["Center", "Flavored", "Hashi", "Ratatui", "ratatui"]

[words.corrections]

[patterns]
# Inline code spans were masked by the previous dictionary snapshot; kept until
# the shared dictionary rules on it. They name APIs, variables and identifiers
# (`Color`, `NO_COLOR`, `thr_123`) whose spelling is not prose.
ignore = ['`[^`\n]+`']

[files]
exclude = []
