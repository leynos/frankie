name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@6cec89bac47a21cf756d68d638a9a510998e57f8
        with:
          expect-cache: any
          # One sccache lane with coverage-main.yml's publisher: only a push to main saves,
          # so pull requests warm from the lane main's publisher writes.
          sccache-cache-discriminator: coverage
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: >-
          leynos/shared-actions/.github/actions/install-mdtablefix@6cec89bac47a21cf756d68d638a9a510998e57f8
        with:
          version: '0.6.0'
      - name: Format
        run: make check-fmt
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
        with:
          globs: '**/*.md'
      - name: Spelling
        run: make spelling
      - name: Workflow contracts
        run: make workflow-contracts
      - name: Install Whitaker Dylint suite
        uses: leynos/shared-actions/.github/actions/install-whitaker@6dea5677a84fec60ca51b07202570e3af12ffdb4
      - name: Lint
        run: make lint
      - name: Install VidaiMock
        shell: bash
        env:
          VIDAIMOCK_SHA256: ${{ vars.VIDAIMOCK_SHA256 }}
        run: |
          set -euo pipefail
          VIDAIMOCK_VERSION="v0.1.2"
          VIDAIMOCK_TARBALL="vidaimock-linux-x64.tar.gz"
          VIDAIMOCK_URL="https://github.com/vidaiUK/VidaiMock/releases/download/${VIDAIMOCK_VERSION}/${VIDAIMOCK_TARBALL}"
          VIDAIMOCK_SHA256_DEFAULT="0efd1dd07f745465e6af9b122a04e6663ad475dd255e34851ef7e1b751acf8d5"

          mkdir -p "${HOME}/.local/bin"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          mkdir -p "${HOME}/git"
          pushd "${HOME}/git"
          curl -fsSLO "${VIDAIMOCK_URL}"
          if [[ -z "${VIDAIMOCK_SHA256:-}" ]]; then
            echo "VIDAIMOCK_SHA256 is not set; using pinned fallback checksum for v0.1.2." >&2
            VIDAIMOCK_SHA256="${VIDAIMOCK_SHA256_DEFAULT}"
          fi
          echo "${VIDAIMOCK_SHA256}  ${VIDAIMOCK_TARBALL}" | sha256sum --check
          tar -xzf "${VIDAIMOCK_TARBALL}"
          cp vidaimock/vidaimock "${HOME}/.local/bin"
          popd
          chmod +x "${HOME}/.local/bin/vidaimock"
          if ! "${HOME}/.local/bin/vidaimock" --version >/dev/null; then
            echo "VidaiMock sanity check failed: --version returned non-zero." >&2
            exit 1
          fi
      # Coverage here serves the local ratchet and nothing else: the report is
      # not archived and CodeScene is never called. coverage-main.yml writes
      # the baseline this compares against and owns the CodeScene upload, so
      # the selection below must match that workflow's field for field.
      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@ff1dd759dfffc0db3459e30e833f52437ee62b57
        with:
          output-path: lcov.info
          format: lcov
          with-ratchet: 'true'
          publish-artefact: 'false'
